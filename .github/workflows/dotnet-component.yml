name: CI - Component Libraries

on:
  push:
    branches:
      - main
      - release/1.*
    paths:
      - .github/workflows/dotnet-component.yml
      - src/SampSharp.*/**
      - test/**
      - SampSharp.slnx
      - Directory.Build.props
      - build.cmd
      - build.sh

  pull_request:
    branches:
      - main
      - release/1.*
    paths:
      - .github/workflows/dotnet-component.yml
      - src/SampSharp.*/**
      - test/**
      - SampSharp.slnx
      - Directory.Build.props
      - build.cmd
      - build.sh

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build component libraries
      run: ./build.sh component-libraries

    - name: Test component libraries
      run: ./build.sh component-libraries test
      env:
        DotNetTestNoBuild: 'true'

    - name: Publish component library test results
      if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: EnricoMi/publish-unit-test-result-action@v2.23.0
      with:
        files: build/artifacts/test-results/component-libraries/*.trx
        check_name: Component library test results
        comment_mode: off

    - name: Upload component library test results
      if: (!cancelled())
      uses: actions/upload-artifact@v7
      with:
        name: component-library-test-results
        path: build/artifacts/test-results/component-libraries/
        if-no-files-found: error
        retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

    - name: Pack component libraries
      run: ./build.sh component-libraries publish

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: sampsharp-component-nuget-packages
        path: build/artifacts/packages/
        if-no-files-found: error
        retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
